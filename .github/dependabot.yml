# Dependabot version updates: one weekly PR per ecosystem for minor and patch
# (grouped), separate PRs for major, at most 5 open per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: Zależności
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: Docker
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: CI
    groups:
      minor-and-patch:
        update-types: [minor, patch]
