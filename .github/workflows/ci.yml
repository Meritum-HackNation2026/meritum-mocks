name: CI/CD

# One run per commit (push only; a PR shows the run of its head commit).
#   verify   Biome, types, tests (architecture included), import boundaries and dead
#            code on the GCP runners (self-hosted, meritum);
#            a newer push to the same branch cancels it, never on main.
#   deploy   main -> https://meritum-<platform>.gburek.app (x, facebook, instagram,
#            reddit, tiktok, discord), on dellpromaxgb10 after verify; never cancelled, one at a time.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 15
    concurrency:
      group: ci-verify-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # pnpm from npm (version from packageManager); the store stays on the runner.
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm biome ci --reporter=github --error-on-warnings .
      - run: pnpm typecheck # tsc strict
      - run: pnpm test # unit tests and tests/architecture: JSDoc @feature, constants, 250 lines, design-system copy sums
      - run: pnpm depcruise # import boundaries (.dependency-cruiser.cjs)
      - run: pnpm knip # dead code and unused dependencies

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dellpromaxgb10]
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy
        run: deploy/deploy.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Public check
        run: |
          # discord: soft check until meritum-infra routes meritum-discord.gburek.app here.
          for platform in x facebook instagram reddit tiktok discord; do
            url="https://meritum-$platform.gburek.app/api/health"
            ok=""
            for _ in $(seq 12); do
              if curl -fsS "$url" | grep -q '"database":"ok"'; then ok=1; echo "OK: $url"; break; fi
              sleep 5
            done
            [ -n "$ok" ] || echo "::warning title=Public check::$url does not answer yet"
          done
